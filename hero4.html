<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hero Option 4 — Immersive Parallax | Impixal Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<style>
:root{--bg:#000000;--surface:#0a0a0a;--border:rgba(255,255,255,.08);--text:#f0f2fa;--muted:#a0aac8;--dim:#626c8e;--c1:#6ea8ff;--c2:#b06bff;--c3:#ff6b9d;--c4:#ff9f43;--c5:#3dd9a4;--c6:#ffd166;--white:#fff;--max:1280px}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.container{max-width:var(--max);margin:0 auto;padding:0 28px}
.hero{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:120px 0;overflow:hidden}
.hero-bg{position:absolute;inset:-10%;z-index:0;background:radial-gradient(ellipse 60% 50% at 50% 50%,rgba(110,168,255,.18),transparent 60%),radial-gradient(ellipse 40% 40% at 20% 80%,rgba(255,107,157,.12),transparent 60%),radial-gradient(ellipse 40% 40% at 80% 20%,rgba(176,107,255,.12),transparent 60%)}
.hero-bg-text{position:absolute;inset:0;z-index:0;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden}
.hero-bg-text span{font-family:'Space Grotesk',sans-serif;font-weight:900;font-size:28vw;letter-spacing:-.06em;color:rgba(255,255,255,.025);white-space:nowrap;line-height:1}
.hero-grid{position:absolute;inset:0;z-index:0;opacity:.35;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:80px 80px;mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,black,transparent)}
.hero-content{position:relative;z-index:1;text-align:center;max-width:900px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;border-radius:999px;background:rgba(110,168,255,.09);border:1px solid rgba(110,168,255,.25);color:var(--c1);font-size:13px;font-weight:500;margin-bottom:28px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c3));box-shadow:0 0 14px var(--c3);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.5)}}
.hero h1{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:clamp(56px,11vw,140px);line-height:.85;letter-spacing:-.05em;margin-bottom:28px}
.hero h1 .grad{background:linear-gradient(120deg,var(--c1) 0%,var(--c2) 25%,var(--c3) 50%,var(--c4) 75%,var(--c6) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{font-size:clamp(17px,1.7vw,21px);color:var(--muted);max-width:600px;margin:0 auto 44px;line-height:1.5}
.hero-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 32px;border-radius:999px;font-weight:600;font-size:15px;cursor:pointer;border:1px solid transparent;transition:all .3s}
.btn-primary{background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));color:#fff;box-shadow:0 8px 24px rgba(110,168,255,.3)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(110,168,255,.45)}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--white);border-color:rgba(255,255,255,.18);backdrop-filter:blur(8px)}
.scroll-hint{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--dim);font-size:12px;letter-spacing:.15em;text-transform:uppercase}
.scroll-hint .line{width:1px;height:40px;background:linear-gradient(180deg,var(--c1),transparent);animation:scrollLine 2s infinite}
@keyframes scrollLine{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.label{position:absolute;top:24px;left:24px;font-size:12px;color:var(--dim);letter-spacing:.15em;text-transform:uppercase;background:rgba(0,0,0,.4);padding:6px 14px;border-radius:999px;border:1px solid var(--border);z-index:2}
</style>
</head>
<body>
<div class="label">Hero 4 — Immersive</div>
<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-bg-text"><span>IMPIXAL</span></div>
  <div class="hero-grid"></div>
  <div class="container hero-content">
    <div class="eyebrow">Strategy, Design, Performance</div>
    <h1><span class="grad">Designing dreams<br/>into digital reality.</span></h1>
    <p class="hero-sub">At Impixal Media, we empower brands through innovative design and strategic marketing tailored to your goals — from concept to clicks.</p>
    <div class="hero-actions">
      <a href="#" class="btn btn-primary">Start a Project &rarr;</a>
      <a href="#" class="btn btn-ghost">View Our Work</a>
    </div>
  </div>
  <div class="scroll-hint"><span>Scroll</span><div class="line"></div></div>
</section>
<script>
  gsap.registerPlugin(ScrollTrigger);
  gsap.from('.eyebrow',{y:20,opacity:0,duration:.8,ease:'power3.out',delay:.2});
  gsap.from('h1',{y:80,opacity:0,duration:1.2,ease:'power4.out',delay:.35});
  gsap.from('.hero-sub',{y:30,opacity:0,duration:.9,ease:'power3.out',delay:.6});
  gsap.from('.hero-actions',{y:20,opacity:0,duration:.8,ease:'power3.out',delay:.75});
  gsap.to('.hero-bg-text',{yPercent:30,scale:1.1,ease:'none',scrollTrigger:{trigger:'.hero',start:'top top',end:'bottom top',scrub:true}});
  gsap.to('.hero-bg',{yPercent:15,ease:'none',scrollTrigger:{trigger:'.hero',start:'top top',end:'bottom top',scrub:true}});
  gsap.to('.hero-content',{yPercent:10,opacity:.7,ease:'none',scrollTrigger:{trigger:'.hero',start:'top top',end:'bottom top',scrub:true}});
</script>
</body>
</html>
