<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" width="1400" height="850" fill="none">
  <defs>
    <linearGradient id="deskBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b172e"/>
      <stop offset="60%" stop-color="#050d1a"/>
      <stop offset="100%" stop-color="#02060d"/>
    </linearGradient>
    <linearGradient id="folderNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1d3b"/>
      <stop offset="100%" stop-color="#061022"/>
    </linearGradient>
    <linearGradient id="goldFoil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5e3"/>
      <stop offset="35%" stop-color="#e0b889"/>
      <stop offset="65%" stop-color="#be8750"/>
      <stop offset="100%" stop-color="#8c5826"/>
    </linearGradient>
    <linearGradient id="whiteCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f3fa"/>
    </linearGradient>
    <filter id="deskShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="2" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1400" height="850" fill="url(#deskBg)"/>

  <!-- Top Header Band -->
  <g transform="translate(80, 60)">
    <text x="0" y="0" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="13" fill="#d4a574" letter-spacing="0.22em">COLLATERAL SUITE &#183; PATIENT TOUCHPOINTS</text>
    <text x="0" y="36" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="32" fill="#ffffff" letter-spacing="-0.02em">Premium Tactile Experience</text>
    <text x="0" y="64" font-family="'Inter', sans-serif" font-size="14" fill="#a0aac8">600gsm Cotton Stock, Hot Stamped Gold Foil, and Gilded Edges for every clinical document.</text>
  </g>

  <!-- Item 1: Large Presentation / Case File Folder -->
  <g transform="translate(100, 170)" filter="url(#deskShadow)">
    <rect width="520" height="600" rx="16" fill="url(#folderNavy)" stroke="rgba(212,165,116,0.35)" stroke-width="1.5"/>
    <!-- Folder Tab & Spine line -->
    <line x1="28" y1="0" x2="28" y2="600" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Gold Foil EverSmile Crest in Center of Folder -->
    <g transform="translate(260, 260)">
      <!-- Tooth Emblem -->
      <path d="M-32 -60 C-58 -60 -76 -42 -76 -12 C-76 24 -56 68 -44 108 C-40 120 -30 120 -26 108 C-18 80 -10 54 0 54 C10 54 18 80 26 108 C30 120 40 120 44 108 C56 68 76 24 76 -12 C76 -42 58 -60 32 -60 C16 -60 6 -50 0 -42 C-6 -50 -16 -60 -32 -60 Z" fill="none" stroke="url(#goldFoil)" stroke-width="3"/>
      <!-- Smile Curve -->
      <path d="M-46 6 Q0 48 46 6" stroke="url(#goldFoil)" stroke-width="6" stroke-linecap="round" fill="none"/>
      <!-- Braces Elements -->
      <rect x="-34" y="12" width="7" height="7" rx="1.5" fill="url(#goldFoil)"/>
      <rect x="-12" y="24" width="7" height="7" rx="1.5" fill="url(#goldFoil)"/>
      <rect x="6" y="24" width="7" height="7" rx="1.5" fill="url(#goldFoil)"/>
      <rect x="28" y="12" width="7" height="7" rx="1.5" fill="url(#goldFoil)"/>
      <!-- Sparkle -->
      <path d="M58 -48 L61 -36 L73 -33 L61 -30 L58 -18 L55 -30 L43 -33 L55 -36 Z" fill="url(#goldFoil)"/>

      <!-- Folder Typography -->
      <text x="0" y="160" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="-0.02em">EverSmile<tspan fill="url(#goldFoil)"> Dental</tspan></text>
      <text x="0" y="188" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#d4a574" letter-spacing="0.26em">ORTHODONTIC &amp; IMPLANT DOSSIER</text>
      <text x="0" y="235" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#7a7f8a">CONFIDENTIAL CLINICAL DIAGNOSIS &amp; TREATMENT PLAN</text>
    </g>

    <!-- Bottom Gold Corner Trim -->
    <path d="M480 600 L520 600 L520 560 Z" fill="url(#goldFoil)"/>
  </g>

  <!-- Item 2: Business Card Front (Deep Navy + Gold Foil) -->
  <g transform="translate(680, 180) rotate(-4)" filter="url(#deskShadow)">
    <rect width="360" height="210" rx="12" fill="#08142a" stroke="url(#goldFoil)" stroke-width="1.2"/>
    <!-- Edge Gilding Accent -->
    <rect x="0" y="0" width="360" height="210" rx="12" fill="none" stroke="url(#goldFoil)" stroke-width="3" stroke-dasharray="10 350"/>

    <g transform="translate(180, 95)" text-anchor="middle">
      <!-- Mini Gold Tooth -->
      <path d="M-14 -26 C-26 -26 -34 -18 -34 -5 C-34 10 -25 30 -20 48 C-18 53 -13 53 -11 48 C-8 36 -4 24 0 24 C4 24 8 36 11 48 C13 53 18 53 20 48 C25 30 34 10 34 -5 C34 -18 26 -26 14 -26 C7 -26 3 -21 0 -18 C-3 -21 -7 -26 -14 -26 Z" fill="url(#goldFoil)"/>
      <path d="M-20 4 Q0 22 20 4" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>

      <text x="0" y="72" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="20" fill="#ffffff" letter-spacing="-0.02em">EverSmile<tspan fill="url(#goldFoil)"> Dental</tspan></text>
      <text x="0" y="90" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="9" fill="#d4a574" letter-spacing="0.22em">CLINICAL EXCELLENCE</text>
    </g>
  </g>

  <!-- Item 3: Business Card Back (Crisp White + Titanium Grey / Gold) -->
  <g transform="translate(940, 290) rotate(8)" filter="url(#deskShadow)">
    <rect width="360" height="210" rx="12" fill="url(#whiteCard)" stroke="rgba(212,165,116,0.5)" stroke-width="1.2"/>
    <!-- Gold Left Accent Bar -->
    <rect x="0" y="0" width="8" height="210" rx="4" fill="url(#goldFoil)"/>

    <g transform="translate(36, 48)">
      <text x="0" y="0" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="18" fill="#07142d">Dr. Aryan Mehta, MDS</text>
      <text x="0" y="18" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#d4a574" letter-spacing="0.1em">CHIEF ORTHODONTIST &amp; IMPLANTOLOGIST</text>

      <line x1="0" y1="36" x2="280" y2="36" stroke="#e0e4ec" stroke-width="1"/>

      <text x="0" y="58" font-family="'Inter', sans-serif" font-size="11" fill="#474c58">+91 98250 10599 &#183; appointments@eversmile.in</text>
      <text x="0" y="78" font-family="'Inter', sans-serif" font-size="11" fill="#474c58">402, Platinum Galleria, Bodakdev</text>
      <text x="0" y="98" font-family="'Inter', sans-serif" font-size="11" fill="#474c58">Ahmedabad, Gujarat 380054</text>
      <text x="0" y="128" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#07142d">www.eversmiledental.in</text>
    </g>
  </g>

  <!-- Item 4: Patient Treatment Passport / Warranty Card -->
  <g transform="translate(680, 480)" filter="url(#deskShadow)">
    <rect width="580" height="260" rx="14" fill="#091730" stroke="rgba(212,165,116,0.3)" stroke-width="1.2"/>
    <!-- Header -->
    <rect x="0" y="0" width="580" height="52" rx="14" fill="#050e1f"/>
    <text x="24" y="32" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="15" fill="#ffffff">EVERSMILE PATIENT WARRANTY &amp; CARE PASSPORT</text>
    <rect x="460" y="14" width="96" height="24" rx="12" fill="url(#goldFoil)"/>
    <text x="508" y="30" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="10" fill="#07142d">10-YR IMPLANT</text>

    <!-- Patient Grid Lines -->
    <g transform="translate(24, 85)" font-family="'Space Grotesk', sans-serif" font-size="11">
      <text x="0" y="0" fill="#7a7f8a">PATIENT NAME</text>
      <text x="0" y="24" font-weight="700" font-size="14" fill="#ffffff">Aarav K. Patel</text>
      <line x1="0" y1="36" x2="240" y2="36" stroke="rgba(255,255,255,0.1)"/>

      <text x="300" y="0" fill="#7a7f8a">CASE RECORD ID</text>
      <text x="300" y="24" font-weight="700" font-size="14" fill="#d4a574">EVR-2026-9041B</text>
      <line x1="300" y1="36" x2="530" y2="36" stroke="rgba(255,255,255,0.1)"/>

      <text x="0" y="65" fill="#7a7f8a">PROCEDURE SPECIFICATION</text>
      <text x="0" y="88" font-weight="600" font-size="13" fill="#ffffff">Dual Bimaxillary Clear Orthodontic Alignment + Titanium Abutment 24/25</text>

      <text x="0" y="125" fill="#7a7f8a">AUTHORIZED CLINIC SEAL</text>
      <circle cx="480" cy="110" r="32" stroke="url(#goldFoil)" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
      <text x="480" y="114" text-anchor="middle" font-weight="800" font-size="9" fill="url(#goldFoil)">VERIFIED</text>
    </g>
  </g>

  <!-- Item 5: Sleek Brushed Brass Clinic Pen -->
  <g transform="translate(1310, 220)" filter="url(#deskShadow)">
    <rect x="-10" y="0" width="20" height="520" rx="10" fill="url(#goldFoil)"/>
    <rect x="-8" y="20" width="16" height="40" rx="4" fill="#5c3814"/>
    <rect x="-4" y="20" width="8" height="120" rx="3" fill="#ffffff" opacity="0.6"/>
    <!-- Pocket Clip -->
    <rect x="-16" y="50" width="6" height="130" rx="2" fill="#fff5e3"/>
  </g>
</svg>