<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" width="1400" height="850" fill="none">
  <defs>
    <!-- Wall Surface Texture -->
    <linearGradient id="wallNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07132a"/>
      <stop offset="50%" stop-color="#0a1a38"/>
      <stop offset="100%" stop-color="#040b18"/>
    </linearGradient>
    <linearGradient id="brassChannel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5e0"/>
      <stop offset="30%" stop-color="#e2ba8c"/>
      <stop offset="70%" stop-color="#bf8a54"/>
      <stop offset="100%" stop-color="#7a4e23"/>
    </linearGradient>
    <!-- Backlit Halo Glow -->
    <filter id="backlitGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Architectural Spotlight Cone -->
    <radialGradient id="spotLight1" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#fff1d6" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#d4a574" stop-opacity="0.18"/>
      <stop offset="80%" stop-color="#d4a574" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#d4a574" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotLight2" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#fff1d6" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#d4a574" stop-opacity="0.18"/>
      <stop offset="80%" stop-color="#d4a574" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#d4a574" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2a47" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#0b172e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#050d1a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Deep Slate Wall Surface -->
  <rect width="1400" height="850" fill="url(#wallNavy)"/>

  <!-- Vertical Fluted Wall Slats (Architectural Luxury Aesthetic) -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="850"/>
    <line x1="160" y1="0" x2="160" y2="850"/>
    <line x1="220" y1="0" x2="220" y2="850"/>
    <line x1="280" y1="0" x2="280" y2="850"/>
    <line x1="340" y1="0" x2="340" y2="850"/>
    <line x1="400" y1="0" x2="400" y2="850"/>
    <line x1="1000" y1="0" x2="1000" y2="850"/>
    <line x1="1060" y1="0" x2="1060" y2="850"/>
    <line x1="1120" y1="0" x2="1120" y2="850"/>
    <line x1="1180" y1="0" x2="1180" y2="850"/>
    <line x1="1240" y1="0" x2="1240" y2="850"/>
    <line x1="1300" y1="0" x2="1300" y2="850"/>
  </g>

  <!-- Architectural Ceiling Trim & Spotlights -->
  <rect x="0" y="0" width="1400" height="32" fill="#030710"/>
  <rect x="0" y="30" width="1400" height="4" fill="url(#brassChannel)"/>

  <!-- Spotlights Cones casting down -->
  <polygon points="500,32 300,550 700,550" fill="url(#spotLight1)"/>
  <polygon points="900,32 700,550 1100,550" fill="url(#spotLight2)"/>

  <!-- Spotlight Fixtures -->
  <ellipse cx="500" cy="32" rx="20" ry="6" fill="#d4a574"/>
  <ellipse cx="900" cy="32" rx="20" ry="6" fill="#d4a574"/>

  <!-- Main Signboard Fascia (Honed Granite / Navy Panel) -->
  <rect x="220" y="140" width="960" height="360" rx="20" fill="#08152e" stroke="rgba(212,165,116,0.4)" stroke-width="2"/>
  <rect x="224" y="144" width="952" height="352" rx="16" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Backlit 3D Letters & Emblem -->
  <!-- 1. Illuminated Tooth Emblem -->
  <g transform="translate(360, 310)" filter="url(#backlitGlow)">
    <!-- Backlit Halo Shadow -->
    <path d="M-28 -50 C-50 -50 -68 -34 -68 -8 C-68 22 -48 58 -38 92 C-34 102 -26 102 -22 92 C-14 68 -8 46 0 46 C8 46 14 68 22 92 C26 102 34 102 38 92 C48 58 68 22 68 -8 C68 -34 50 -50 28 -50 C14 -50 6 -42 0 -36 C-6 -42 -14 -50 -28 -50 Z" fill="#d4a574" opacity="0.6"/>

    <!-- 3D Channel Depth -->
    <path d="M-28 -50 C-50 -50 -68 -34 -68 -8 C-68 22 -48 58 -38 92 C-34 102 -26 102 -22 92 C-14 68 -8 46 0 46 C8 46 14 68 22 92 C26 102 34 102 38 92 C48 58 68 22 68 -8 C68 -34 50 -50 28 -50 C14 -50 6 -42 0 -36 C-6 -42 -14 -50 -28 -50 Z" fill="#7a4e23" transform="translate(2, 4)"/>

    <!-- Front Brass Face -->
    <path d="M-28 -50 C-50 -50 -68 -34 -68 -8 C-68 22 -48 58 -38 92 C-34 102 -26 102 -22 92 C-14 68 -8 46 0 46 C8 46 14 68 22 92 C26 102 34 102 38 92 C48 58 68 22 68 -8 C68 -34 50 -50 28 -50 C14 -50 6 -42 0 -36 C-6 -42 -14 -50 -28 -50 Z" fill="url(#brassChannel)" stroke="#ffffff" stroke-width="0.8"/>

    <!-- Smile Curve -->
    <path d="M-40 4 Q0 40 40 4" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Sparkle Star -->
    <path d="M52 -40 L55 -30 L65 -28 L55 -26 L52 -16 L49 -26 L39 -28 L49 -30 Z" fill="#fff" filter="url(#backlitGlow)"/>
  </g>

  <!-- 2. Illuminated 3D Typography -->
  <g transform="translate(470, 300)">
    <!-- Halo Backlight on Text -->
    <text x="0" y="0" font-family="'Space Grotesk', 'Gabarito', sans-serif" font-weight="900" font-size="64" fill="#d4a574" opacity="0.5" filter="url(#backlitGlow)" letter-spacing="-0.02em">EverSmile</text>
    <!-- 3D Extrusion Shadow -->
    <text x="3" y="3" font-family="'Space Grotesk', 'Gabarito', sans-serif" font-weight="900" font-size="64" fill="#4d3112" letter-spacing="-0.02em">EverSmile</text>
    <!-- Brass Face -->
    <text x="0" y="0" font-family="'Space Grotesk', 'Gabarito', sans-serif" font-weight="900" font-size="64" fill="url(#brassChannel)" letter-spacing="-0.02em">EverSmile</text>

    <!-- Dental Subtitle -->
    <text x="316" y="0" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="64" fill="#ffffff" letter-spacing="-0.02em">Dental</text>

    <!-- Sub-descriptor -->
    <text x="4" y="44" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="18" fill="#d4a574" letter-spacing="0.26em">ORTHODONTIC &amp; IMPLANT CLINIC</text>
    <text x="4" y="74" font-family="'Inter', sans-serif" font-weight="500" font-size="13" fill="#a0aac8">SUITE 402 &#183; PRIVATE SPECIALTY CONSULTATION &#183; BY APPOINTMENT</text>
  </g>

  <!-- Lower Glass Entryway & Transom Door Frame -->
  <g transform="translate(420, 560)">
    <!-- Door Frame (Dark Anodized Aluminum with Brass Inset) -->
    <rect width="560" height="290" fill="#02050b" stroke="url(#brassChannel)" stroke-width="2"/>
    <!-- Double Glass Panels -->
    <rect x="15" y="15" width="255" height="275" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.1)"/>
    <rect x="290" y="15" width="255" height="275" fill="url(#glassGrad)" stroke="rgba(255,255,255,0.1)"/>

    <!-- Frosted Window Vinyl Decal (Left Door) -->
    <g transform="translate(142, 100)" opacity="0.65">
      <circle cx="0" cy="0" r="38" stroke="rgba(255,255,255,0.5)" stroke-width="1.2" fill="none"/>
      <path d="M-12 -22 C-22 -22 -30 -14 -30 -2 C-30 12 -20 28 -16 42 C-14 48 -10 48 -8 42 C-6 30 -2 20 0 20 C2 20 6 30 8 42 C10 48 14 48 16 42 C20 28 30 12 30 -2 C30 -14 22 -22 12 -22 Z" fill="rgba(255,255,255,0.6)"/>
      <path d="M-18 6 Q0 22 18 6" stroke="#fff" stroke-width="2" fill="none"/>
    </g>

    <!-- Frosted Clinic Hours (Right Door) -->
    <g transform="translate(417, 90)" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="rgba(255,255,255,0.75)" letter-spacing="0.08em">
      <text x="0" y="0" font-weight="700" fill="#d4a574">CLINIC HOURS</text>
      <text x="0" y="18">MON &#8211; FRI: 09:00 &#8211; 19:30</text>
      <text x="0" y="34">SATURDAY: 09:00 &#8211; 16:00</text>
      <text x="0" y="50">EMERGENCY: 24/7 CALL DESK</text>
    </g>

    <!-- Vertical Brass Door Pull Handles -->
    <rect x="240" y="100" width="10" height="90" rx="5" fill="url(#brassChannel)" filter="url(#backlitGlow)"/>
    <rect x="310" y="100" width="10" height="90" rx="5" fill="url(#brassChannel)" filter="url(#backlitGlow)"/>
  </g>

  <!-- Architectural Label -->
  <g transform="translate(80, 800)" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#7a7f8a">
    <text x="0" y="0">EVERSMILE ARCHITECTURAL GUIDELINES &#183; FAÇADE SPECIFICATION 2026</text>
  </g>
  <g transform="translate(1320, 800)" text-anchor="end" font-family="'Space Grotesk', sans-serif" font-size="12" fill="#d4a574">
    <text x="0" y="0">HALO-LIT BRUSHED BRASS &#183; HONED NAVY SLATE</text>
  </g>
</svg>