<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#142c54" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#07142d" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#030814"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="42%" r="40%">
      <stop offset="0%" stop-color="#d4a574" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#d4a574" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#d4a574" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldMet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0d0"/>
      <stop offset="25%" stop-color="#e8c28a"/>
      <stop offset="50%" stop-color="#c5925e"/>
      <stop offset="75%" stop-color="#f5deb3"/>
      <stop offset="100%" stop-color="#9e6d38"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8ec"/>
      <stop offset="50%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#8a5a2b"/>
    </linearGradient>
    <linearGradient id="titanium" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#b0b7c6"/>
      <stop offset="70%" stop-color="#7a7f8a"/>
      <stop offset="100%" stop-color="#474c58"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2244" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#061022" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#d4a574" flood-opacity="0.35"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#050c1a"/>
  <rect width="1600" height="900" fill="url(#bgGlow)"/>

  <!-- Architectural Background Grid -->
  <g opacity="0.12" stroke="#6ea8ff" stroke-width="0.8">
    <line x1="0" y1="150" x2="1600" y2="150"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>

  <!-- Golden Ratio Geometric Construction Circles -->
  <g opacity="0.18" stroke="url(#goldMet)" stroke-width="1" fill="none">
    <circle cx="800" cy="380" r="320"/>
    <circle cx="800" cy="380" r="230" stroke-dasharray="4 6"/>
    <circle cx="800" cy="380" r="142"/>
    <circle cx="800" cy="380" r="88" stroke-dasharray="2 4"/>
    <line x1="480" y1="60" x2="1120" y2="700" stroke-opacity="0.3"/>
    <line x1="1120" y1="60" x2="480" y2="700" stroke-opacity="0.3"/>
  </g>

  <circle cx="800" cy="380" r="420" fill="url(#goldGlow)"/>

  <!-- Architectural Floating Shield Card -->
  <rect x="420" y="110" width="760" height="540" rx="36" fill="url(#shieldGrad)" stroke="rgba(212,165,116,0.3)" stroke-width="1.5" filter="url(#goldShadow)"/>
  <rect x="422" y="112" width="756" height="536" rx="34" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Master Floating Tooth Logomark -->
  <g transform="translate(800, 310)" filter="url(#goldShadow)">
    <path d="M-64 -115 C-115 -115 -152 -78 -152 -18 C-152 52 -110 135 -86 215 C-78 240 -58 240 -50 215 C-34 160 -22 110 0 110 C22 110 34 160 50 215 C58 240 78 240 86 215 C110 135 152 52 152 -18 C152 -78 115 -115 64 -115 C30 -115 12 -95 0 -82 C-12 -95 -30 -115 -64 -115 Z" fill="#040b18" opacity="0.6" transform="translate(0, 16)"/>
    <path d="M-64 -115 C-115 -115 -152 -78 -152 -18 C-152 52 -110 135 -86 215 C-78 240 -58 240 -50 215 C-34 160 -22 110 0 110 C22 110 34 160 50 215 C58 240 78 240 86 215 C110 135 152 52 152 -18 C152 -78 115 -115 64 -115 C30 -115 12 -95 0 -82 C-12 -95 -30 -115 -64 -115 Z" fill="#0a1936" stroke="url(#goldMet)" stroke-width="4"/>

    <!-- Inner Enamel Radiance -->
    <path d="M-56 -100 C-100 -100 -134 -68 -134 -15 C-134 46 -96 122 -75 192 C-68 212 -54 212 -46 192 C-32 145 -18 96 0 96 C18 96 32 145 46 192 C54 212 68 212 75 192 C96 122 134 46 134 -15 C134 -68 100 -100 56 -100 C28 -100 12 -82 0 -72 C-12 -82 -28 -100 -56 -100 Z" fill="url(#titanium)" opacity="0.08"/>

    <!-- Implant Threading Ribs -->
    <g stroke="url(#goldLight)" stroke-width="2.5" stroke-linecap="round" opacity="0.75">
      <line x1="-76" y1="150" x2="-56" y2="155"/>
      <line x1="-72" y1="172" x2="-52" y2="177"/>
      <line x1="-68" y1="194" x2="-50" y2="198"/>
      <line x1="56" y1="155" x2="76" y2="150"/>
      <line x1="52" y1="177" x2="72" y2="172"/>
      <line x1="50" y1="198" x2="68" y2="194"/>
    </g>

    <!-- Golden Smile Arc -->
    <path d="M-92 12 Q0 94 92 12" stroke="url(#goldMet)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M-92 12 Q0 94 92 12" stroke="#fff8ec" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- Braces Alignment Nodes -->
    <g fill="url(#goldMet)">
      <rect x="-66" y="24" width="12" height="12" rx="3" stroke="#fff" stroke-width="1"/>
      <rect x="-26" y="44" width="12" height="12" rx="3" stroke="#fff" stroke-width="1"/>
      <rect x="14" y="44" width="12" height="12" rx="3" stroke="#fff" stroke-width="1"/>
      <rect x="54" y="24" width="12" height="12" rx="3" stroke="#fff" stroke-width="1"/>
      <path d="M-72 30 Q0 60 72 30" stroke="#fff" stroke-width="1.8" stroke-dasharray="2 3" fill="none" opacity="0.9"/>
    </g>

    <!-- Radiance Sparkle Star -->
    <g transform="translate(112, -92)">
      <path d="M0 -34 L7 -9 L32 0 L7 9 L0 34 L-7 9 L-32 0 L-7 -9 Z" fill="url(#goldMet)"/>
      <circle cx="0" cy="0" r="5" fill="#ffffff" filter="url(#softGlow)"/>
    </g>
  </g>

  <!-- Typography Masthead inside Card -->
  <g text-anchor="middle">
    <text x="800" y="545" font-family="'Space Grotesk', 'Gabarito', sans-serif" font-weight="800" font-size="52" fill="#ffffff" letter-spacing="-0.03em">EverSmile<tspan fill="url(#goldMet)"> Dental</tspan></text>
    <text x="800" y="585" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#d4a574" letter-spacing="0.28em">ADVANCED ORTHODONTIC &amp; IMPLANT CARE</text>
  </g>

  <!-- Editorial Metadata Tags Bottom -->
  <g font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#a0aac8">
    <rect x="100" y="770" width="360" height="64" rx="16" fill="rgba(15,34,68,0.7)" stroke="rgba(212,165,116,0.3)"/>
    <text x="130" y="798" fill="#d4a574" font-weight="700" font-size="11" letter-spacing="0.12em">CLIENT IDENTITY CASE STUDY</text>
    <text x="130" y="818" fill="#ffffff" font-size="15" font-weight="700">EverSmile Dental Speciality Clinic</text>

    <rect x="620" y="770" width="360" height="64" rx="16" fill="rgba(15,34,68,0.7)" stroke="rgba(212,165,116,0.3)"/>
    <text x="650" y="798" fill="#d4a574" font-weight="700" font-size="11" letter-spacing="0.12em">IDENTITY SCOPE</text>
    <text x="650" y="818" fill="#ffffff" font-size="15" font-weight="700">Logo · Spatial · Print · Digital Suite</text>

    <rect x="1140" y="770" width="360" height="64" rx="16" fill="rgba(15,34,68,0.7)" stroke="rgba(212,165,116,0.3)"/>
    <text x="1170" y="798" fill="#d4a574" font-weight="700" font-size="11" letter-spacing="0.12em">BRAND CRAFTED BY</text>
    <text x="1170" y="818" fill="#ffffff" font-size="15" font-weight="700">Impixal Media &#183; Studio Ahmedabad</text>
  </g>

  <g fill="url(#goldMet)">
    <circle cx="80" cy="80" r="4"/>
    <circle cx="1520" cy="80" r="4"/>
    <circle cx="80" cy="820" r="4"/>
    <circle cx="1520" cy="820" r="4"/>
  </g>
</svg>