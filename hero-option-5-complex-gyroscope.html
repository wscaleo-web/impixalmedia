<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hero Option 5 — Complex Animated SVG | Impixal Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<style>
:root{--bg:#000000;--surface:#0a0a0a;--border:rgba(255,255,255,.08);--text:#f0f2fa;--muted:#a0aac8;--dim:#626c8e;--c1:#6ea8ff;--c2:#b06bff;--c3:#ff6b9d;--c4:#ff9f43;--c5:#3dd9a4;--c6:#ffd166;--white:#fff;--max:1280px}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.container{max-width:var(--max);margin:0 auto;padding:0 28px}
.hero{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:120px 0;overflow:hidden}
.hero-bg{position:absolute;inset:-10%;z-index:0;background:radial-gradient(ellipse 50% 40% at 30% 40%,rgba(110,168,255,.15),transparent 60%),radial-gradient(ellipse 40% 35% at 70% 60%,rgba(255,107,157,.12),transparent 60%),radial-gradient(ellipse 35% 30% at 50% 80%,rgba(176,107,255,.1),transparent 60%)}
.hero-grid{position:absolute;inset:0;z-index:0;opacity:.3;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,black,transparent)}
.hero-svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:90vw;max-width:900px;opacity:.85;z-index:0;pointer-events:none}
.hero-content{position:relative;z-index:1;text-align:center;max-width:800px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;border-radius:999px;background:rgba(110,168,255,.09);border:1px solid rgba(110,168,255,.25);color:var(--c1);font-size:13px;font-weight:500;margin-bottom:28px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c3));box-shadow:0 0 14px var(--c3);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.5)}}
.hero h1{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:clamp(52px,9vw,120px);line-height:.9;letter-spacing:-.05em;margin-bottom:24px}
.hero h1 .grad{background:linear-gradient(120deg,var(--c1) 0%,var(--c2) 25%,var(--c3) 50%,var(--c4) 75%,var(--c6) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{font-size:clamp(17px,1.7vw,21px);color:var(--muted);max-width:580px;margin:0 auto 40px;line-height:1.5}
.hero-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 32px;border-radius:999px;font-weight:600;font-size:15px;cursor:pointer;border:1px solid transparent;transition:all .3s}
.btn-primary{background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));color:#fff;box-shadow:0 8px 24px rgba(110,168,255,.3)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(110,168,255,.45)}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--white);border-color:rgba(255,255,255,.18);backdrop-filter:blur(8px)}
.label{position:absolute;top:24px;left:24px;font-size:12px;color:var(--dim);letter-spacing:.15em;text-transform:uppercase;background:rgba(0,0,0,.4);padding:6px 14px;border-radius:999px;border:1px solid var(--border);z-index:2}
/* animations */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spin2{to{transform:rotate(-360deg)}}
@keyframes spin-slow{to{transform:rotate(360deg)}}
@keyframes pulse-ring{0%,100%{opacity:.3}50%{opacity:.05}}
@keyframes dash{to{stroke-dashoffset:-1000}}
@keyframes morph{0%,100%{d:path("M400,200 Q480,280 400,360 Q320,280 400,200 Z")}50%{d:path("M400,180 Q500,300 400,380 Q300,300 400,180 Z")}}
.spin{animation:spin 50s linear infinite}
.spin2{animation:spin2 30s linear infinite}
.spin-slow{animation:spin-slow 100s linear infinite}
.pulse-ring{animation:pulse-ring 5s ease-in-out infinite}
.dash{animation:dash 30s linear infinite}
@media (max-width:900px){.hero-svg{width:130vw;opacity:.6}}
</style>
</head>
<body>
<div class="label">Hero 5 — Complex</div>
<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-grid"></div>
  <svg class="hero-svg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ea8ff" stop-opacity=".8"/><stop offset=".33" stop-color="#b06bff" stop-opacity=".5"/><stop offset=".66" stop-color="#ff6b9d" stop-opacity=".3"/><stop offset="1" stop-color="#ffd166" stop-opacity=".1"/></linearGradient>
      <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3dd9a4" stop-opacity=".6"/><stop offset="1" stop-color="#6ea8ff" stop-opacity=".1"/></linearGradient>
      <linearGradient id="g3" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ff9f43" stop-opacity=".5"/><stop offset="1" stop-color="#ff6b9d" stop-opacity=".1"/></linearGradient>
      <radialGradient id="core" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#6ea8ff" stop-opacity=".5"/><stop offset=".4" stop-color="#b06bff" stop-opacity=".2"/><stop offset="1" stop-color="#ff6b9d" stop-opacity="0"/></radialGradient>
      <radialGradient id="core2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd166" stop-opacity=".3"/><stop offset="1" stop-color="#ff9f43" stop-opacity="0"/></radialGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glow2"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <!-- mesh background particles -->
    <g opacity=".35">
      <circle cx="120" cy="120" r="1.5" fill="#6ea8ff"/><circle cx="200" cy="80" r="1" fill="#b06bff"/>
      <circle cx="680" cy="150" r="2" fill="#ff6b9d"/><circle cx="720" cy="220" r="1" fill="#ffd166"/>
      <circle cx="100" cy="680" r="1.5" fill="#3dd9a4"/><circle cx="180" cy="720" r="1" fill="#6ea8ff"/>
      <circle cx="650" cy="700" r="2" fill="#b06bff"/><circle cx="700" cy="620" r="1" fill="#ff9f43"/>
      <circle cx="350" cy="60" r="1" fill="#ffd166"/><circle cx="450" cy="740" r="1.5" fill="#6ea8ff"/>
      <circle cx="60" cy="380" r="1" fill="#ff6b9d"/><circle cx="740" cy="420" r="1.5" fill="#3dd9a4"/>
    </g>
    <!-- outer dashed ring -->
    <circle cx="400" cy="400" r="370" fill="none" stroke="url(#g1)" stroke-width=".8" stroke-dasharray="4 12" opacity=".3" class="spin-slow"/>
    <!-- 12 concentric rings -->
    <circle cx="400" cy="400" r="350" fill="none" stroke="url(#g1)" stroke-width=".6" opacity=".25" class="dash"/>
    <circle cx="400" cy="400" r="320" fill="none" stroke="url(#g2)" stroke-width="1" opacity=".35" stroke-dasharray="8 6"/>
    <circle cx="400" cy="400" r="295" fill="none" stroke="url(#g3)" stroke-width=".8" opacity=".3"/>
    <circle cx="400" cy="400" r="265" fill="none" stroke="url(#g1)" stroke-width="1.2" opacity=".45"/>
    <circle cx="400" cy="400" r="235" fill="none" stroke="url(#g2)" stroke-width="1" opacity=".5" stroke-dasharray="3 5"/>
    <circle cx="400" cy="400" r="205" fill="none" stroke="url(#g3)" stroke-width="1.2" opacity=".55"/>
    <circle cx="400" cy="400" r="175" fill="none" stroke="url(#g1)" stroke-width="1.5" opacity=".6"/>
    <circle cx="400" cy="400" r="145" fill="none" stroke="url(#g2)" stroke-width="1.2" opacity=".65" stroke-dasharray="2 4"/>
    <circle cx="400" cy="400" r="115" fill="none" stroke="url(#g3)" stroke-width="1.5" opacity=".7"/>
    <circle cx="400" cy="400" r="85" fill="none" stroke="url(#g1)" stroke-width="1.8" opacity=".75"/>
    <circle cx="400" cy="400" r="55" fill="none" stroke="url(#g2)" stroke-width="1.5" opacity=".8"/>
    <circle cx="400" cy="400" r="25" fill="none" stroke="url(#g3)" stroke-width="1.2" opacity=".9"/>
    <!-- core glow -->
    <circle cx="400" cy="400" r="120" fill="url(#core)" class="pulse-ring"/>
    <circle cx="400" cy="400" r="60" fill="url(#core2)"/>
    <circle cx="400" cy="400" r="20" fill="#6ea8ff" opacity=".9" filter="url(#glow)"/>
    <!-- morphing blob -->
    <path d="M400,220 Q500,300 400,380 Q300,300 400,220 Z" fill="url(#g1)" opacity=".12" class="morph"/>
    <!-- rotating layer 1: diamonds + dots -->
    <g class="spin" style="transform-origin:400px 400px">
      <path d="M400 30 L425 95 L400 115 L375 95 Z" fill="url(#g1)" filter="url(#glow)"/>
      <path d="M770 400 L705 425 L685 400 L705 375 Z" fill="url(#g2)" filter="url(#glow)"/>
      <path d="M400 770 L375 705 L400 685 L425 705 Z" fill="url(#g3)" filter="url(#glow)"/>
      <path d="M30 400 L95 375 L115 400 L95 425 Z" fill="url(#g1)" filter="url(#glow)"/>
      <!-- 8 mid diamonds -->
      <path d="M590 95 L602 125 L590 137 L578 125 Z" fill="#b06bff" opacity=".75"/>
      <path d="M705 210 L717 240 L705 252 L693 240 Z" fill="#ff6b9d" opacity=".75"/>
      <path d="M705 590 L693 560 L705 548 L717 560 Z" fill="#ffd166" opacity=".75"/>
      <path d="M590 705 L578 675 L590 663 L602 675 Z" fill="#3dd9a4" opacity=".75"/>
      <path d="M210 705 L222 675 L210 663 L198 675 Z" fill="#b06bff" opacity=".75"/>
      <path d="M95 590 L107 560 L95 548 L83 560 Z" fill="#ff6b9d" opacity=".75"/>
      <path d="M95 210 L83 240 L95 252 L107 240 Z" fill="#ffd166" opacity=".75"/>
      <path d="M210 95 L198 125 L210 137 L222 125 Z" fill="#3dd9a4" opacity=".75"/>
    </g>
    <!-- rotating layer 2: orbit dots -->
    <g class="spin2" style="transform-origin:400px 400px">
      <circle cx="400" cy="30" r="6" fill="#6ea8ff" filter="url(#glow)"/>
      <circle cx="770" cy="400" r="6" fill="#b06bff" filter="url(#glow)"/>
      <circle cx="400" cy="770" r="6" fill="#ff6b9d" filter="url(#glow)"/>
      <circle cx="30" cy="400" r="6" fill="#ffd166" filter="url(#glow)"/>
      <circle cx="626" cy="174" r="4.5" fill="#3dd9a4" filter="url(#glow)"/>
      <circle cx="626" cy="626" r="4.5" fill="#6ea8ff" filter="url(#glow)"/>
      <circle cx="174" cy="626" r="4.5" fill="#b06bff" filter="url(#glow)"/>
      <circle cx="174" cy="174" r="4.5" fill="#ff6b9d" filter="url(#glow)"/>
      <circle cx="541" cy="109" r="3" fill="#ffd166"/>
      <circle cx="691" cy="259" r="3" fill="#3dd9a4"/>
      <circle cx="691" cy="541" r="3" fill="#6ea8ff"/>
      <circle cx="541" cy="691" r="3" fill="#b06bff"/>
      <circle cx="259" cy="691" r="3" fill="#ff6b9d"/>
      <circle cx="109" cy="541" r="3" fill="#ffd166"/>
      <circle cx="109" cy="259" r="3" fill="#3dd9a4"/>
      <circle cx="259" cy="109" r="3" fill="#6ea8ff"/>
    </g>
    <!-- rotating layer 3: triangles -->
    <g class="spin-slow" style="transform-origin:400px 400px">
      <path d="M400 60 L412 85 L388 85 Z" fill="#6ea8ff" opacity=".5"/>
      <path d="M740 400 L715 412 L715 388 Z" fill="#b06bff" opacity=".5"/>
      <path d="M400 740 L388 715 L412 715 Z" fill="#ff6b9d" opacity=".5"/>
      <path d="M60 400 L85 388 L85 412 Z" fill="#ffd166" opacity=".5"/>
    </g>
    <!-- arc strokes -->
    <g opacity=".4" class="spin2" style="transform-origin:400px 400px">
      <path d="M 400 50 A 350 350 0 0 1 750 400" fill="none" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round" class="dash"/>
      <path d="M 750 400 A 350 350 0 0 1 400 750" fill="none" stroke="url(#g2)" stroke-width="1.5" stroke-linecap="round" class="dash"/>
      <path d="M 400 750 A 350 350 0 0 1 50 400" fill="none" stroke="url(#g3)" stroke-width="1.5" stroke-linecap="round" class="dash"/>
      <path d="M 50 400 A 350 350 0 0 1 400 50" fill="none" stroke="url(#g1)" stroke-width="1.5" stroke-linecap="round" class="dash"/>
    </g>
    <!-- tick marks -->
    <g opacity=".4">
      <line x1="400" y1="28" x2="400" y2="48" stroke="#6ea8ff" stroke-width="1.2"/>
      <line x1="772" y1="400" x2="752" y2="400" stroke="#b06bff" stroke-width="1.2"/>
      <line x1="400" y1="772" x2="400" y2="752" stroke="#ff6b9d" stroke-width="1.2"/>
      <line x1="28" y1="400" x2="48" y2="400" stroke="#ffd166" stroke-width="1.2"/>
    </g>
  </svg>
  <div class="container hero-content">
    <div class="eyebrow">Strategy, Design, Performance</div>
    <h1>Designing <span class="grad">dreams</span><br/>into digital reality.</h1>
    <p class="hero-sub">At Impixal Media, we empower brands through innovative design and strategic marketing tailored to your goals — from concept to clicks.</p>
    <div class="hero-actions">
      <a href="#" class="btn btn-primary">Start a Project &rarr;</a>
      <a href="#" class="btn btn-ghost">View Our Work</a>
    </div>
  </div>
</section>
<script>
  gsap.registerPlugin(ScrollTrigger);
  gsap.from('.eyebrow',{y:20,opacity:0,duration:.8,ease:'power3.out',delay:.2});
  gsap.from('h1',{y:60,opacity:0,duration:1.1,ease:'power4.out',delay:.35});
  gsap.from('.hero-sub',{y:30,opacity:0,duration:.9,ease:'power3.out',delay:.55});
  gsap.from('.hero-actions',{y:20,opacity:0,duration:.8,ease:'power3.out',delay:.7});
  gsap.to('.hero-bg',{yPercent:20,ease:'none',scrollTrigger:{trigger:'.hero',start:'top top',end:'bottom top',scrub:true}});
  gsap.to('.hero-content',{yPercent:12,opacity:.7,ease:'none',scrollTrigger:{trigger:'.hero',start:'top top',end:'bottom top',scrub:true}});
  gsap.to('.hero-svg',{yPercent:8,rotation:5,ease:'none',scrollTrigger:{trigger:'.hero',start:'top top',end:'bottom top',scrub:true}});
</script>
</body>
</html>
