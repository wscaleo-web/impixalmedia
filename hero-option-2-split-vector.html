<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hero Option 2 — Split + SVG | Impixal Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<style>
:root{--bg:#000000;--surface:#0a0a0a;--border:rgba(255,255,255,.08);--text:#f0f2fa;--muted:#a0aac8;--dim:#626c8e;--c1:#6ea8ff;--c2:#b06bff;--c3:#ff6b9d;--c4:#ff9f43;--c5:#3dd9a4;--c6:#ffd166;--white:#fff;--max:1280px}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.container{max-width:var(--max);margin:0 auto;padding:0 28px}
.hero{position:relative;min-height:100vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:120px 0;overflow:hidden;gap:40px}
.hero-bg{position:absolute;inset:0;z-index:0}
.grid-bg{position:absolute;inset:0;z-index:0;opacity:.4;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:50px 50px;mask-image:radial-gradient(ellipse 80% 70% at 50% 50%,black,transparent)}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45;animation:float 14s ease-in-out infinite}
.blob-1{width:500px;height:500px;background:radial-gradient(circle,var(--c1) 0%,transparent 70%);top:-10%;right:0}
.blob-2{width:400px;height:400px;background:radial-gradient(circle,var(--c3) 0%,transparent 70%);bottom:-10%;left:10%;animation-delay:-6s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.1)}}
.hero-content{position:relative;z-index:1}
.eyebrow{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;border-radius:999px;background:rgba(110,168,255,.09);border:1px solid rgba(110,168,255,.25);color:var(--c1);font-size:13px;font-weight:500;margin-bottom:28px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c3));box-shadow:0 0 14px var(--c3);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.5)}}
.hero h1{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:clamp(44px,6vw,80px);line-height:.95;letter-spacing:-.04em;margin-bottom:24px}
.hero h1 .grad{background:linear-gradient(120deg,var(--c1) 0%,var(--c2) 40%,var(--c3) 80%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{font-size:18px;color:var(--muted);max-width:520px;margin-bottom:36px;line-height:1.5}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 28px;border-radius:999px;font-weight:600;font-size:15px;cursor:pointer;border:1px solid transparent;transition:all .3s}
.btn-primary{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;box-shadow:0 8px 24px rgba(110,168,255,.3)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(110,168,255,.45)}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--white);border-color:rgba(255,255,255,.18)}
.hero-visual{position:relative;z-index:1;display:grid;place-items:center}
.hero-svg{width:100%;max-width:520px}
.label{position:absolute;top:24px;left:24px;font-size:12px;color:var(--dim);letter-spacing:.15em;text-transform:uppercase;background:rgba(0,0,0,.4);padding:6px 14px;border-radius:999px;border:1px solid var(--border);z-index:2}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding:100px 0}.hero-visual{order:-1}}
</style>
</head>
<body>
<div class="label">Hero 2 — Split</div>
<section class="hero">
  <div class="hero-bg"><div class="grid-bg"></div><div class="blob blob-1"></div><div class="blob blob-2"></div></div>
  <div class="container" style="display:contents">
    <div class="hero-content">
      <div class="eyebrow">Strategy, Design, Performance</div>
      <h1>Designing <span class="grad">dreams</span><br/>into digital reality.</h1>
      <p class="hero-sub">At Impixal Media, we empower brands through innovative design and strategic marketing tailored to your goals — from concept to clicks.</p>
      <div class="hero-actions">
        <a href="#" class="btn btn-primary">Start a Project &rarr;</a>
        <a href="#" class="btn btn-ghost">View Our Work</a>
      </div>
    </div>
    <div class="hero-visual">
      <svg class="hero-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ea8ff"/><stop offset="1" stop-color="#ff6b9d"/></linearGradient>
          <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b06bff"/><stop offset="1" stop-color="#ffd166"/></linearGradient>
        </defs>
        <circle cx="250" cy="250" r="200" fill="none" stroke="url(#a)" stroke-width="1" opacity=".4" stroke-dasharray="4 8"/>
        <circle cx="250" cy="250" r="150" fill="none" stroke="url(#b)" stroke-width="1.5" opacity=".5"/>
        <circle cx="250" cy="250" r="100" fill="none" stroke="url(#a)" stroke-width="2" opacity=".6"/>
        <circle cx="250" cy="250" r="50" fill="url(#a)" opacity=".15"/>
        <circle cx="250" cy="250" r="16" fill="#6ea8ff" opacity=".9"/>
        <g style="transform-origin:250px 250px;animation:spin 30s linear infinite">
          <circle cx="250" cy="50" r="8" fill="#6ea8ff"/>
          <circle cx="450" cy="250" r="8" fill="#b06bff"/>
          <circle cx="250" cy="450" r="8" fill="#ff6b9d"/>
          <circle cx="50" cy="250" r="8" fill="#ffd166"/>
          <path d="M250 50 L260 80 L250 90 L240 80 Z" fill="#6ea8ff" opacity=".6"/>
        </g>
        <g style="transform-origin:250px 250px;animation:spin2 20s linear infinite">
          <circle cx="391" cy="109" r="5" fill="#3dd9a4"/>
          <circle cx="391" cy="391" r="5" fill="#6ea8ff"/>
          <circle cx="109" cy="391" r="5" fill="#b06bff"/>
          <circle cx="109" cy="109" r="5" fill="#ff6b9d"/>
        </g>
      </svg>
    </div>
  </div>
</section>
<style>@keyframes spin{to{transform:rotate(360deg)}}@keyframes spin2{to{transform:rotate(-360deg)}}</style>
<script>
  gsap.registerPlugin(ScrollTrigger);
  gsap.from('.eyebrow',{y:20,opacity:0,duration:.8,ease:'power3.out',delay:.2});
  gsap.from('h1',{y:50,opacity:0,duration:1,ease:'power4.out',delay:.35});
  gsap.from('.hero-sub',{y:25,opacity:0,duration:.8,ease:'power3.out',delay:.5});
  gsap.from('.hero-actions',{y:20,opacity:0,duration:.7,ease:'power3.out',delay:.65});
  gsap.from('.hero-visual',{x:60,opacity:0,duration:1.1,ease:'power3.out',delay:.4});
  gsap.to('.hero-bg',{yPercent:20,ease:'none',scrollTrigger:{trigger:'.hero',start:'top top',end:'bottom top',scrub:true}});
</script>
</body>
</html>
